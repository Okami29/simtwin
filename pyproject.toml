[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simtwin"
version = "0.1.0"
description = "SimTwin: a reproducible open-source digital-twin simulator for networked FDM/FFF additive-manufacturing fleets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nata Sulakvelidze" }]
keywords = [
    "digital-twin", "additive-manufacturing", "fdm", "fff", "simulation",
    "industrial-iot", "mqtt", "fault-injection", "reproducibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "pyarrow>=16.0",
    "psutil>=5.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1"]
test = ["pytest>=8.0"]

[project.scripts]
simtwin-experiments = "experiments.run_all:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
